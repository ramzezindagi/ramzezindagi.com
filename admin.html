<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ramz Admin</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--night:#0E1324;--indigo:#171D36;--dusk:#232B4D;--moon:#D6B26C;--ivory:#ECE6D8;--smoke:#9298AE;--line:rgba(214,178,108,.28);--red:#f87171;--ur:"Noto Nastaliq Urdu",serif}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--night);color:var(--ivory);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea{font:inherit;color:var(--ivory);width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:8px;background:var(--indigo)}
input[type=date]{color-scheme:dark}
textarea.ur{font-family:var(--ur);direction:rtl;font-size:1.25rem;line-height:2.4;min-height:190px;resize:vertical}
label{display:block;font-size:13px;font-weight:600;color:var(--smoke);margin:14px 0 6px}
.wrap{max-width:900px;margin:0 auto;padding:0 18px}
.top{position:sticky;top:0;z-index:5;background:rgba(14,19,36,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
.brand{display:flex;gap:10px;align-items:center;font-weight:600}
.brand img{width:30px;height:30px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;border:1px solid var(--line)}
.btn.gold{background:var(--moon);color:var(--night);border-color:var(--moon)}
.btn.red{color:var(--red)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--indigo);border:1px solid var(--line);border-radius:14px;padding:22px}
.center{min-height:80vh;display:grid;place-items:center}
.login{width:100%;max-width:380px}
.login h1{font-size:24px;margin-bottom:4px}
.muted{color:var(--smoke);font-size:14px}
.msg{margin-top:12px;font-size:14px;padding:10px 12px;border-radius:8px;display:none}
.msg.err{display:block;background:rgba(248,113,113,.12);color:var(--red)}
.msg.ok{display:block;background:rgba(214,178,108,.12);color:var(--moon)}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:26px 0 16px;flex-wrap:wrap}
.head b{font-size:20px}
.list{display:grid;gap:12px;padding-bottom:60px}
.poem blockquote{font-family:var(--ur);direction:rtl;text-align:center;font-size:1.2rem;line-height:2.4}
.poem blockquote span{display:block}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--smoke)}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px}
.tag.on{background:rgba(214,178,108,.15);color:var(--moon)}
.tag.off{background:rgba(146,152,174,.15);color:var(--smoke)}
.tag.later{background:rgba(96,165,250,.15);color:#93c5fd}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.empty{text-align:center;padding:40px 10px;color:var(--smoke)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;gap:8px;align-items:center;margin-top:16px;font-size:14px;color:var(--ivory)}
.check input{width:auto}
dialog{margin:auto;border:1px solid var(--line);border-radius:16px;padding:0;width:min(620px,94vw);max-height:92vh;background:var(--indigo);color:var(--ivory)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog form{padding:22px}
dialog h2{font-size:20px}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="top"><div class="wrap">
  <div class="brand"><img src="/assets/favicon-192.png" alt="">Ramz Admin</div>
  <div style="display:flex;gap:8px">
    <a class="btn sm" href="/#daily" target="_blank" rel="noopener">View site</a>
    <button class="btn sm" id="logoutBtn" hidden>Log out</button>
  </div>
</div></div>

<div class="wrap center" id="loginView" hidden>
  <form class="card login" id="loginForm">
    <h1>Log in</h1>
    <p class="muted">Add the daily poetry for ramzezindagi.com.</p>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn gold" style="width:100%;justify-content:center;margin-top:16px">Log in</button>
    <div class="msg" id="loginMsg"></div>
  </form>
</div>

<div class="wrap center" id="setupView" hidden>
  <div class="card login"><h1>Setup not finished</h1><p class="muted" id="setupText"></p></div>
</div>

<div class="wrap" id="panel" hidden>
  <div class="head">
    <div><b>Roz ka Kalam</b><div class="muted" id="hint"></div></div>
    <button class="btn gold" id="addBtn">+ Add poetry</button>
  </div>
  <div class="msg" id="panelMsg"></div>
  <div class="list" id="list"></div>
</div>

<dialog id="dlg"><form id="form" method="dialog">
  <h2 id="dlgTitle">Add poetry</h2>
  <input type="hidden" name="id">
  <label>Poetry (one line per row)</label>
  <textarea class="ur" name="text" maxlength="3000" required placeholder="پہلا مصرع&#10;دوسرا مصرع"></textarea>
  <div class="row">
    <div><label>Poet (leave empty if it's Ramz's own)</label><input name="poet" maxlength="80" dir="auto"></div>
    <div><label>Date it shows on the site</label><input type="date" name="date" required></div>
  </div>
  <label>Short note under the poetry (optional)</label>
  <input name="note" maxlength="300" dir="auto">
  <label class="check"><input type="checkbox" name="show" checked> Show on website</label>
  <div class="msg" id="formMsg"></div>
  <div class="foot"><button type="button" class="btn" id="cancelBtn">Cancel</button><button class="btn gold" id="saveBtn">Save</button></div>
</form></dialog>

<script>
const $ = (s) => document.querySelector(s);
let poems = [], today = '';
const esc = (s) => String(s || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const show = (el, t, ok) => { el.className = 'msg ' + (ok ? 'ok' : 'err'); el.textContent = t; };
const hide = (el) => { el.className = 'msg'; el.textContent = ''; };

async function call(url, opts = {}) {
  const r = await fetch(url, { credentials: 'same-origin', ...opts });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && url !== '/api/admin/login') { view('login'); throw new Error(j.error || 'Please log in.'); }
  if (!r.ok) throw new Error(j.error || 'Something went wrong (' + r.status + ').');
  return j;
}
const post = (url, body) => call(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });

function view(n) {
  $('#loginView').hidden = n !== 'login'; $('#setupView').hidden = n !== 'setup';
  $('#panel').hidden = n !== 'panel'; $('#logoutBtn').hidden = n !== 'panel';
}

async function start() {
  try {
    const s = await call('/api/admin/status');
    if (!s.ready) {
      const miss = [];
      if (!s.kv) miss.push('the storage (RAMZ_KV)');
      if (!s.password) miss.push('the admin password (ADMIN_PASSWORD)');
      $('#setupText').textContent = 'Still missing in Cloudflare: ' + miss.join(' and ') + '.';
      return view('setup');
    }
    if (!s.admin) return view('login');
    view('panel'); await reload();
  } catch (e) { $('#setupText').textContent = e.message; view('setup'); }
}

$('#loginForm').onsubmit = async (e) => {
  e.preventDefault(); hide($('#loginMsg'));
  try { await post('/api/admin/login', { password: $('#pw').value }); $('#pw').value = ''; view('panel'); await reload(); }
  catch (err) { show($('#loginMsg'), err.message); }
};
$('#logoutBtn').onclick = async () => { await fetch('/api/admin/logout', { method: 'POST' }); view('login'); };

async function reload() {
  try { const d = await call('/api/admin/poems'); poems = d.poems; today = d.today; render(); }
  catch (e) { show($('#panelMsg'), e.message); }
}

function render() {
  const list = [...poems].sort((a, b) => (b.date + b.created).localeCompare(a.date + a.created));
  const hasToday = list.some((p) => p.show && p.date === today);
  $('#hint').textContent = (hasToday ? 'Today\'s poetry is added. ' : 'Nothing added for today (' + today + ') yet. ') + list.length + ' in total.';
  if (!list.length) { $('#list').innerHTML = '<div class="card empty">No poetry yet. Tap “+ Add poetry”. The section stays hidden on the website until the first one is shown.</div>'; return; }
  $('#list').innerHTML = list.map((p) => {
    const lines = p.text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
    const state = !p.show ? '<span class="tag off">Hidden</span>' : p.date > today ? '<span class="tag later">Scheduled</span>' : '<span class="tag on">Live</span>';
    return `<div class="card poem">
      <blockquote>${lines.map((l) => `<span>${esc(l)}</span>`).join('')}</blockquote>
      <div class="meta">${state}<span>${esc(p.date)}</span>${p.poet ? `<span>· ${esc(p.poet)}</span>` : ''}</div>
      <div class="acts">
        <button class="btn sm" data-op="edit" data-id="${p.id}">Edit</button>
        <button class="btn sm" data-op="toggle" data-id="${p.id}">${p.show ? 'Hide' : 'Show'}</button>
        <button class="btn sm red" data-op="delete" data-id="${p.id}">Delete</button>
      </div></div>`;
  }).join('');
}

$('#list').onclick = async (e) => {
  const b = e.target.closest('button[data-op]'); if (!b) return;
  const { id, op } = b.dataset;
  if (op === 'edit') return openForm(id);
  if (op === 'delete' && !confirm('Delete this poetry for good? This cannot be undone. Tip: use "Hide" if you may want it back.')) return;
  b.disabled = true;
  try { await post('/api/admin/action', { id, op }); await reload(); }
  catch (err) { show($('#panelMsg'), err.message); b.disabled = false; }
};

$('#addBtn').onclick = () => openForm('');
$('#cancelBtn').onclick = () => $('#dlg').close();

function openForm(id) {
  const f = $('#form'), p = id ? poems.find((x) => x.id === id) : null;
  f.reset(); hide($('#formMsg'));
  $('#dlgTitle').textContent = p ? 'Edit poetry' : 'Add poetry';
  f.id.value = id || '';
  f.text.value = p ? p.text : '';
  f.poet.value = p ? p.poet || '' : '';
  f.note.value = p ? p.note || '' : '';
  f.date.value = p ? p.date : today;
  f.show.checked = p ? !!p.show : true;
  $('#dlg').showModal();
}

$('#form').onsubmit = async (e) => {
  e.preventDefault(); const f = e.target; hide($('#formMsg'));
  $('#saveBtn').disabled = true; $('#saveBtn').textContent = 'Saving…';
  try {
    await post('/api/admin/poem', { id: f.id.value, text: f.text.value, poet: f.poet.value, note: f.note.value, date: f.date.value, show: f.show.checked });
    $('#dlg').close(); await reload();
  } catch (err) { show($('#formMsg'), err.message); }
  $('#saveBtn').disabled = false; $('#saveBtn').textContent = 'Save';
};

start();
</script>
</body>
</html>
